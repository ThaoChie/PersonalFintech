services:
  api:
    build:
      context: ./Server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=FinanceJarDb;User=root;Password=0944138963Pt@;
      - Jwt__Key=ThisIsASecretKeyForJwtTokenGeneration123!
      - Jwt__Issuer=FinanceJarServer
      - Jwt__Audience=FinanceJarClient
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - db

  db:
    image: mysql:9.0
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=0944138963Pt@
      - MYSQL_DATABASE=FinanceJarDb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql 

volumes:
  mysql_data: